name: Build King Crimson Roundabout

on:
  workflow_dispatch:
  push:
    branches: [ "main", "build/**" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon repository
        uses: actions/checkout@v4
        with:
          path: addon

      - name: Checkout Roundabout upstream
        uses: actions/checkout@v4
        with:
          repository: Hydraheads/RoundaboutMod
          ref: 16ae85aa2338269192923418ad42930215a74f0c
          path: roundabout

      - name: Apply King Crimson visual patch
        working-directory: roundabout
        run: |
          cp ../addon/README.md README-addon.md
          python3 ../addon/patches/apply_patch.py

      - name: Replace Time Erase activation sound
        working-directory: roundabout
        shell: bash
        run: |
          SOUND_FILE="common/src/main/resources/assets/roundabout/sounds/time_erase_full.ogg"
          rm -f "$SOUND_FILE"
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://www.dropbox.com/scl/fi/nsnzghhbu3hy2hux55nkx/lv_0_20261122192001.ogg?rlkey=94f2zxmf13qq6d0913fcr29ty&st=kt51qc5p&dl=1" \
            --output "$SOUND_FILE"
          test -s "$SOUND_FILE"
          if [ "$(head -c 4 "$SOUND_FILE")" != "OggS" ]; then
            echo "Downloaded activation sound is not a valid OGG file."
            exit 1
          fi
          echo "Replaced the original time_erase_full.ogg with the user's OGG."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: roundabout/gradle/wrapper/gradle-wrapper.properties

      - name: Build Fabric jar
        working-directory: roundabout
        run: chmod +x ./gradlew && ./gradlew :fabric:build --no-daemon

      - name: Inspect build outputs
        run: find roundabout -type f -path "*/build/libs/*" -print

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: KingCrimson-Roundabout-Fabric-1.20.1
          path: roundabout/fabric/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
